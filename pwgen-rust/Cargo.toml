[package]
name = "pwgen-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
locale_config = "0.3"

# Highly optimized builds by default (even for `cargo build`)
[profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"
strip = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"
strip = true
